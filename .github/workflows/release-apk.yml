name: Release 80endance APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g., v1.0, v1.1). Leave blank to use versionName from app/build.gradle.kts.'
        required: false
        default: ''
      release_notes:
        description: 'Optional custom What'\''s New notes. Leave blank to automatically use RELEASE_NOTES.md.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    name: Build & Publish 80endance Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Google Services JSON (from secret or repo)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 --decode > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          elif [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json not found. Add the GOOGLE_SERVICES_JSON repository secret (paste the contents of google-services.json) or commit app/google-services.json."
            exit 1
          fi

      - name: Determine release version and signing mode
        id: meta
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          INPUT_TAG: ${{ inputs.version_tag }}
        run: |
          APP_VERSION=$(grep -oE '(defaultAppVersionName|versionName)\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)"/\1/')
          APP_VERSION="${APP_VERSION:-1.5}"

          TRIMMED_INPUT=$(printf '%s' "$INPUT_TAG" | tr -d '[:space:]')
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "$TRIMMED_INPUT" ]; then
            if [[ "$TRIMMED_INPUT" == v* || "$TRIMMED_INPUT" == V* ]]; then
              RELEASE_TAG="v${TRIMMED_INPUT:1}"
            else
              RELEASE_TAG="v${TRIMMED_INPUT}"
            fi
          else
            RELEASE_TAG="v${APP_VERSION}"
          fi

          # Strip leading v/V so Android versionName is clean (e.g., "1.5" or "1.5.1")
          CLEAN_VERSION="${RELEASE_TAG#v}"
          CLEAN_VERSION="${CLEAN_VERSION#V}"

          # Compute monotonic semantic versionCode: major*10000 + minor*100 + patch
          IFS='.' read -r VER_MAJOR VER_MINOR VER_PATCH _ <<< "$(printf '%s' "$CLEAN_VERSION" | grep -oE '[0-9]+(\.[0-9]+)*' | head -n1)"
          VER_MAJOR=$((10#${VER_MAJOR:-1}))
          VER_MINOR=$((10#${VER_MINOR:-0}))
          VER_PATCH=$((10#${VER_PATCH:-0}))
          VERSION_CODE=$((VER_MAJOR * 10000 + VER_MINOR * 100 + VER_PATCH))
          if [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE="${GITHUB_RUN_NUMBER:-1}"
          fi

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            BUILD_MODE="release"
          else
            BUILD_MODE="debug"
          fi

          echo "Release tag: ${RELEASE_TAG} -> Android versionName=${CLEAN_VERSION}, versionCode=${VERSION_CODE}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "build_mode=${BUILD_MODE}" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        if: steps.meta.outputs.build_mode == 'release'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "${KEYSTORE_PATH}"
          gradle :app:assembleRelease \
            -PappVersionName="${{ steps.meta.outputs.clean_version }}" \
            -PappVersionCode="${{ steps.meta.outputs.version_code }}" \
            --no-daemon --stacktrace

      - name: Build APK with bundled signing key (fallback if release secrets are not configured)
        if: steps.meta.outputs.build_mode == 'debug'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 --decode > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          gradle :app:assembleDebug \
            -PappVersionName="${{ steps.meta.outputs.clean_version }}" \
            -PappVersionCode="${{ steps.meta.outputs.version_code }}" \
            --no-daemon --stacktrace

      - name: Prepare & verify Release APK artifact
        id: artifact
        run: |
          MODE="${{ steps.meta.outputs.build_mode }}"
          TAG="${{ steps.meta.outputs.release_tag }}"
          EXPECTED_VERSION="${{ steps.meta.outputs.clean_version }}"
          mkdir -p release-output

          if [ "$MODE" = "release" ]; then
            SRC_APK="app/build/outputs/apk/release/app-release.apk"
          else
            SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ ! -f "$SRC_APK" ]; then
            echo "::error::Expected APK not found at ${SRC_APK}"
            exit 1
          fi

          # Verify the baked-in AndroidManifest versionName & versionCode using aapt2
          AAPT2_BIN=$(find "${ANDROID_HOME}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$AAPT2_BIN" ] && [ -x "$AAPT2_BIN" ]; then
            BADGING=$("$AAPT2_BIN" dump badging "$SRC_APK" | head -n1)
            echo "APK badging: ${BADGING}"
            APK_VER_NAME=$(printf '%s' "$BADGING" | sed -nE "s/.*versionName='([^']+)'.*/\1/p")
            APK_VER_CODE=$(printf '%s' "$BADGING" | sed -nE "s/.*versionCode='([^']+)'.*/\1/p")
            echo "Verified APK versionName=${APK_VER_NAME}, versionCode=${APK_VER_CODE}"
            if [ -n "$APK_VER_NAME" ] && [ "$APK_VER_NAME" != "$EXPECTED_VERSION" ]; then
              echo "::error::APK versionName (${APK_VER_NAME}) does not match expected release version (${EXPECTED_VERSION})!"
              exit 1
            fi
          fi

          APK_NAME="80endance-${TAG}.apk"
          cp "$SRC_APK" "release-output/${APK_NAME}"
          sha256sum "release-output/${APK_NAME}" > "release-output/${APK_NAME}.sha256"

          echo "apk_path=release-output/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=release-output/${APK_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Assemble Release Notes Body
        id: notes
        env:
          CUSTOM_NOTES: ${{ inputs.release_notes }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          CLEAN_VERSION: ${{ steps.meta.outputs.clean_version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APK_NAME: ${{ steps.artifact.outputs.apk_name }}
        run: |
          {
            echo "## 80endance ${RELEASE_TAG}"
            echo ""
            echo "- **App Version:** \`${CLEAN_VERSION}\` (versionCode \`${VERSION_CODE}\`)"
            echo ""
            if [ -n "$CUSTOM_NOTES" ]; then
              echo "### What's New"
              printf '%s\n' "$CUSTOM_NOTES"
              echo ""
            elif [ -f RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
              echo ""
            fi
            echo "### How to Install"
            echo "1. Download **\`${APK_NAME}\`** from the Assets section below on your Android phone (Android 7.0 / API 24 or higher)."
            echo "2. Open the downloaded \`.apk\` file and allow installation from your browser or file manager if prompted."
          } > release-output/release_body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: 80endance ${{ steps.meta.outputs.release_tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body_path: release-output/release_body.md
          files: |
            ${{ steps.artifact.outputs.apk_path }}
            ${{ steps.artifact.outputs.checksum_path }}

      - name: Clean up temporary keystore files
        if: always()
        run: rm -f my-upload-key.jks debug.keystore
