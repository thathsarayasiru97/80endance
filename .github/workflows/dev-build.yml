name: Build Dev APK (80endance-dev)

on:
  push:
    branches:
      - main
      - master
      - dev
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev-apk:
    name: Build 80endance-dev Testing APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Google Services JSON (from secret or repo)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 --decode > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          elif [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json not found. Add the GOOGLE_SERVICES_JSON repository secret (paste the contents of google-services.json) or commit app/google-services.json."
            exit 1
          fi

      - name: Check side-by-side .dev Firebase registration
        id: dev_check
        run: |
          if grep -q '"package_name"[[:space:]]*:[[:space:]]*"com.aistudio.eightyendance.rcxkmv.dev"' app/google-services.json; then
            echo "side_by_side=true" >> "$GITHUB_OUTPUT"
            echo "package_id=com.aistudio.eightyendance.rcxkmv.dev" >> "$GITHUB_OUTPUT"
          else
            echo "side_by_side=false" >> "$GITHUB_OUTPUT"
            echo "package_id=com.aistudio.eightyendance.rcxkmv" >> "$GITHUB_OUTPUT"
          fi

      - name: Build 80endance-dev APK
        id: build
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          GRADLE_FLAGS="-PdevLabel=true"
          if [ "${{ steps.dev_check.outputs.side_by_side }}" = "true" ]; then
            GRADLE_FLAGS="${GRADLE_FLAGS} -PdevPackage=true"
          fi

          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > debug.keystore
            echo "signing_source=DEBUG_KEYSTORE_BASE64 secret" >> "$GITHUB_OUTPUT"
            echo "apk_src=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            gradle :app:assembleDebug ${GRADLE_FLAGS} --no-daemon --stacktrace
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 --decode > debug.keystore
            echo "signing_source=debug.keystore.base64 file" >> "$GITHUB_OUTPUT"
            echo "apk_src=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            gradle :app:assembleDebug ${GRADLE_FLAGS} --no-daemon --stacktrace
          elif [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "${KEYSTORE_PATH}"
            echo "signing_source=RELEASE_KEYSTORE_BASE64 secret" >> "$GITHUB_OUTPUT"
            echo "apk_src=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            gradle :app:assembleRelease ${GRADLE_FLAGS} --no-daemon --stacktrace
          else
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "signing_source=ephemeral random debug keystore (Google Sign-In will fail!)" >> "$GITHUB_OUTPUT"
            echo "apk_src=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            gradle :app:assembleDebug ${GRADLE_FLAGS} --no-daemon --stacktrace
          fi

      - name: Package & verify 80endance-dev APK
        id: artifact
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="80endance-dev-build.${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          mkdir -p dev-output
          cp "${{ steps.build.outputs.apk_src }}" "dev-output/${APK_NAME}"

          APK_SHA1=$(keytool -printcert -jarfile "dev-output/${APK_NAME}" | grep -E 'SHA1:' | head -n1 | sed -E 's/.*SHA1:[[:space:]]*//')
          APK_SHA1_LOWER=$(echo "$APK_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if grep -qi "$APK_SHA1_LOWER" app/google-services.json; then
            SHA1_IN_JSON="true"
          else
            SHA1_IN_JSON="false"
          fi

          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_sha1=${APK_SHA1}" >> "$GITHUB_OUTPUT"
          echo "sha1_in_json=${SHA1_IN_JSON}" >> "$GITHUB_OUTPUT"

      - name: Upload 80endance-dev APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 80endance-dev-build-${{ github.run_number }}
          path: dev-output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Write Build Summary
        run: |
          {
            echo "## 80endance-dev Build #${GITHUB_RUN_NUMBER}"
            echo ""
            echo "- **APK File:** \`${{ steps.artifact.outputs.apk_name }}\`"
            echo "- **App Name:** \`80endance-dev\`"
            echo "- **Package ID:** \`${{ steps.dev_check.outputs.package_id }}\`"
            echo "- **Side-by-Side Install Enabled:** \`${{ steps.dev_check.outputs.side_by_side }}\`"
            echo "- **Signed With:** \`${{ steps.build.outputs.signing_source }}\`"
            echo "- **APK SHA-1:** \`${{ steps.artifact.outputs.apk_sha1 }}\`"
            echo "- **SHA-1 Present in google-services.json:** \`${{ steps.artifact.outputs.sha1_in_json }}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo ""
            if [ "${{ steps.artifact.outputs.sha1_in_json }}" = "false" ]; then
              echo "> **Warning — Google Sign-In SHA-1 mismatch:** \`${{ steps.artifact.outputs.apk_sha1 }}\` was not found in \`app/google-services.json\`. Add this SHA-1 to \`${{ steps.dev_check.outputs.package_id }}\` in Firebase Console and update your \`GOOGLE_SERVICES_JSON\` secret."
              echo ""
            fi
            echo "Download the APK from the **Artifacts** section at the bottom of this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up temporary keystores
        if: always()
        run: rm -f debug.keystore my-upload-key.jks
