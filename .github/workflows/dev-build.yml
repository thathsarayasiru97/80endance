name: Build Dev APK (80endance-dev)

on:
  push:
    branches:
      - main
      - master
      - dev
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev-apk:
    name: Build 80endance-dev Testing APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Google Services JSON (if stored as secret)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Restored app/google-services.json from repository secret."
          elif [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json not found. Commit it or set the GOOGLE_SERVICES_JSON_BASE64 repository secret."
            exit 1
          fi

      - name: Check side-by-side .dev Firebase registration
        id: dev_check
        run: |
          if grep -q '"package_name"[[:space:]]*:[[:space:]]*"com.aistudio.eightyendance.rcxkmv.dev"' app/google-services.json; then
            echo "side_by_side=true" >> "$GITHUB_OUTPUT"
            echo "package_id=com.aistudio.eightyendance.rcxkmv.dev" >> "$GITHUB_OUTPUT"
          else
            echo "side_by_side=false" >> "$GITHUB_OUTPUT"
            echo "package_id=com.aistudio.eightyendance.rcxkmv" >> "$GITHUB_OUTPUT"
          fi

      - name: Build 80endance-dev APK
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          GRADLE_FLAGS="-PdevLabel=true"
          if [ "${{ steps.dev_check.outputs.side_by_side }}" = "true" ]; then
            GRADLE_FLAGS="${GRADLE_FLAGS} -PdevPackage=true"
          fi

          gradle :app:assembleDebug ${GRADLE_FLAGS} --no-daemon --stacktrace

      - name: Package 80endance-dev APK
        id: artifact
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="80endance-dev-build.${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          mkdir -p dev-output
          cp app/build/outputs/apk/debug/app-debug.apk "dev-output/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload 80endance-dev APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 80endance-dev-build-${{ github.run_number }}
          path: dev-output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Write Build Summary
        run: |
          {
            echo "## 80endance-dev Build #${GITHUB_RUN_NUMBER}"
            echo ""
            echo "- **APK File:** \`${{ steps.artifact.outputs.apk_name }}\`"
            echo "- **App Name:** \`80endance-dev\`"
            echo "- **Package ID:** \`${{ steps.dev_check.outputs.package_id }}\`"
            echo "- **Side-by-Side Install Enabled:** \`${{ steps.dev_check.outputs.side_by_side }}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo ""
            echo "Download the APK from the **Artifacts** section at the bottom of this workflow run."
            if [ "${{ steps.dev_check.outputs.side_by_side }}" = "false" ]; then
              echo ""
              echo "> **Tip for side-by-side installation:** To install \`80endance-dev\` alongside the main \`80endance\` app on the same phone, register \`com.aistudio.eightyendance.rcxkmv.dev\` as an Android app in the same Firebase project (with the debug SHA-1 fingerprint) and update \`app/google-services.json\`. This workflow will automatically switch to the \`.dev\` package ID once detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f debug.keystore
